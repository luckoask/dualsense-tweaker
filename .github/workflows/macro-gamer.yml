name: Macro Gamer Windows validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401
      - name: Restore, build, and run all tests
        shell: pwsh
        run: |
          dotnet restore DualSenseTweaker.sln
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build DualSenseTweaker.sln -c Release --no-restore
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet test DualSenseTweaker.sln -c Release --no-build --logger trx --results-directory artifacts/validation/windows
          exit $LASTEXITCODE
      - name: Build distributable MSI
        shell: pwsh
        run: ./tools/build-installer.ps1
      - name: Build previous version for a real major upgrade
        shell: pwsh
        run: |
          git worktree add --detach ../macro-gamer-baseline 922c2fd409bd3d0d8a520a430bafc9ee0b02635d
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ../macro-gamer-baseline/tools/build-installer.ps1
      - name: Validate MSI tables and clean install, repair, feature removal, upgrade, uninstall
        shell: pwsh
        run: ./tools/validate-installer.ps1 -Msi publish/DualSenseTweaker-1.1.0-x64.msi -PreviousMsi ../macro-gamer-baseline/publish/DualSenseTweaker-1.0.7-x64.msi
      - name: Upload installer and verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MacroGamer-Windows-${{ github.sha }}
          path: |
            publish/*.msi
            artifacts/validation/**
          if-no-files-found: error
          retention-days: 14
